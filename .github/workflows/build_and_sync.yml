name: Build Community Registry & Packages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Plugins & Regenerate Index
        run: |
          python tools/build_registry.py

      - name: Commit & Push Changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/ registry/index.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): build packages and regenerate index.json [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "Warning: git push failed, please verify repository workflow write permissions"
          else
            echo "No changes to commit"
          fi
