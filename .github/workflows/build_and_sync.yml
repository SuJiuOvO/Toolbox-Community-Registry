name: Build Community Registry & Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Validation Dependencies
        run: python -m pip install -r requirements.txt

      - name: Test Scaffolds & Registry Validation
        run: python -m unittest discover -s tests -v

      - name: Build Plugins & Regenerate Index
        run: |
          python tools/build_registry.py --release-tag plugins

      - name: Publish Packages to GitHub Release Assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugins
          name: "Community Plugins Release Assets"
          body: "Automated release asset hosting for Multi-Toolbox community plugins"
          files: packages/*.zip
          prerelease: false

      - name: Synchronize Packages to Gitee Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          python tools/sync_gitee_release.py --tag plugins --dir packages

      - name: Commit & Push Changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add registry/index.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): update registry index for release assets [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi
