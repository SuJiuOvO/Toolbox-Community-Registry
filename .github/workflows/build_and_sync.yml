name: Build Community Registry & Packages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'plugins/**'
      - 'tools/**'
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Plugins & Regenerate Index
        run: |
          python tools/build_registry.py

      - name: Commit & Push Changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add packages/ registry/index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): build packages and regenerate index.json [skip ci]" && git push)
