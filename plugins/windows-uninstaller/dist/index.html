<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Windows 软件卸载与残留清理 - Uninstaller</title>
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: #273549;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #38BDF8;
      --primary-hover: #0284C7;
      --danger: #EF4444;
      --danger-hover: #DC2626;
      --danger-tonal-bg: rgba(239, 68, 68, 0.1);
      --danger-tonal-border: rgba(239, 68, 68, 0.22);
      --danger-tonal-text: #F87171;
      --success: #10B981;
      --warning: #F59E0B;
      --badge-bg: rgba(255, 255, 255, 0.08);
      --modal-bg: rgba(15, 23, 42, 0.85);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    [data-theme="light"] {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-border: rgba(0, 0, 0, 0.08);
      --card-hover: #F1F5F9;
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #0284C7;
      --primary-hover: #0369A1;
      --danger-tonal-bg: rgba(239, 68, 68, 0.08);
      --danger-tonal-border: rgba(239, 68, 68, 0.2);
      --danger-tonal-text: #DC2626;
      --badge-bg: rgba(0, 0, 0, 0.06);
      --modal-bg: rgba(241, 245, 249, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Structured Modern Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.15);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand svg {
      width: 22px;
      height: 22px;
      stroke: var(--primary);
      flex-shrink: 0;
    }

    .counter-chip {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .header-search-wrap {
      flex: 1;
      max-width: 440px;
      position: relative;
    }

    .header-search-wrap input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 13.5px;
      outline: none;
      transition: all 0.2s ease;
    }

    .header-search-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .header-search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      pointer-events: none;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-chip {
      padding: 5px 12px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .btn-chip:hover {
      background: var(--card-hover);
      color: var(--text);
    }

    .btn-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      font-weight: 600;
    }

    select {
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }

    .btn-action:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--card-hover);
    }

    /* Tonal Danger Row Action Button (No 100 Red Buttons Clutter) */
    .btn-uninstall-row {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--danger-tonal-bg);
      color: var(--danger-tonal-text);
      border: 1px solid var(--danger-tonal-border);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-uninstall-row:hover:not(:disabled) {
      background: var(--danger);
      color: #FFFFFF;
      border-color: var(--danger);
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.35);
    }

    .btn-uninstall-row:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: transparent;
    }

    /* List Container */
    #app-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .app-card:hover {
      background: var(--card-hover);
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .app-info-col {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    /* Sleek Squircle App Icon */
    .app-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 17px;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .app-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .app-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .app-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: var(--badge-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .badge-primary {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .app-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Modal / Dialog Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-dialog {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 92%;
      max-width: 580px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.show .modal-dialog {
      transform: scale(1);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 16px;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13.5px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      background: rgba(0, 0, 0, 0.15);
    }

    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .meta-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .meta-val {
      font-family: monospace;
      font-size: 12.5px;
      word-break: break-all;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      user-select: text;
    }

    /* Residue Items */
    .residue-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .residue-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .residue-item input[type="checkbox"] {
      margin-top: 3px;
      accent-color: var(--danger);
      width: 16px;
      height: 16px;
    }

    .center-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 40px;
      color: var(--text-muted);
      gap: 12px;
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Structured Header -->
  <header>
    <div class="header-top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
        <span>Windows 软件卸载与残留清理</span>
        <span class="counter-chip" id="app-count-badge">扫描中...</span>
      </div>

      <div class="header-search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="快速过滤软件名称、发布者或版本号..." autocomplete="off">
      </div>

      <div style="display:flex;gap:8px;">
        <button class="btn-action btn-secondary" id="btn-refresh" title="重新扫描已安装列表">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </div>

    <div class="controls-row">
      <div class="filter-group">
        <span style="color:var(--text-muted);font-size:12px;margin-right:2px;">范围:</span>
        <button class="btn-chip active" data-filter="scope" data-val="all">全部范围</button>
        <button class="btn-chip" data-filter="scope" data-val="HKLM">全机器</button>
        <button class="btn-chip" data-filter="scope" data-val="HKCU">当前用户</button>
      </div>

      <div class="filter-group">
        <span style="color:var(--text-muted);font-size:12px;margin-right:2px;">架构:</span>
        <button class="btn-chip active" data-filter="arch" data-val="all">全部架构</button>
        <button class="btn-chip" data-filter="arch" data-val="64">64 位</button>
        <button class="btn-chip" data-filter="arch" data-val="32">32 位</button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text-muted);">
          <input type="checkbox" id="check-show-system" style="accent-color:var(--primary);">
          <span>显示系统内置组件</span>
        </label>
        <select id="sort-select">
          <option value="name">🔤 默认名称排序 (A-Z)</option>
          <option value="size">📦 按软件体积大小</option>
          <option value="date">📅 按安装日期最新</option>
        </select>
      </div>
    </div>
  </header>

  <!-- App List Container -->
  <main id="app-list-container">
    <div class="center-state">
      <div class="spinner"></div>
      <p>正在读取 Windows 注册表已安装软件列表...</p>
    </div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="detail-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div id="modal-app-name">软件详情与卸载配置</div>
        <button class="btn-chip" onclick="closeModal()" style="border:none;font-size:16px;">&times;</button>
      </div>
      <div class="modal-body" id="modal-app-body">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer">
        <label style="margin-right:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);cursor:pointer;">
          <input type="checkbox" id="check-as-admin" checked style="accent-color:var(--primary);">
          <span>以管理员权限提权运行卸载器</span>
        </label>
        <button class="btn-action btn-secondary" onclick="closeModal()">关闭</button>
        <button class="btn-action btn-uninstall-row" id="btn-modal-uninstall" style="padding:7px 16px;">启动官方卸载</button>
      </div>
    </div>
  </div>

  <!-- Residue Scanner Modal -->
  <div class="modal-backdrop" id="residue-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div>🔍 卸载后深度残留扫描</div>
        <button class="btn-chip" onclick="closeResidueModal()" style="border:none;font-size:16px;">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-muted);font-size:12.5px;line-height:1.5;">
          官方卸载程序执行完毕后，常见的数据目录、注册表残留可能依然滞留系统。请勾选您确认不再需要的废弃项：
        </p>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-muted);padding-bottom:4px;">
          <span>检测到的潜在残留项:</span>
          <div style="display:flex;gap:8px;">
            <a href="javascript:void(0)" onclick="toggleAllResidues(true)" style="color:var(--primary);text-decoration:none;">全选</a>
            <span style="opacity:0.3;">|</span>
            <a href="javascript:void(0)" onclick="toggleAllResidues(false)" style="color:var(--text-muted);text-decoration:none;">清空</a>
          </div>
        </div>
        <div id="residue-items-list" style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">
          <!-- Dynamically filled -->
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-secondary" onclick="closeResidueModal()">跳过清理</button>
        <button class="btn-action btn-uninstall-row" id="btn-clean-residues" onclick="executeCleanResidues()" style="padding:7px 16px;">永久删除所选残留</button>
      </div>
    </div>
  </div>

  <script>
    let allApps = [];
    let currentApp = null;
    let residueCandidates = [];
    let filterScope = 'all';
    let filterArch = 'all';
    let showSystem = false;
    let sortBy = 'name';
    let searchQuery = '';

    function getLettermarkGradient(name) {
      let hash = 0;
      for (let i = 0; i < (name || '').length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const h1 = Math.abs(hash % 360);
      const h2 = (h1 + 45) % 360;
      return `linear-gradient(135deg, hsl(${h1}, 70%, 45%), hsl(${h2}, 75%, 35%))`;
    }

    function initBridge() {
      if (!window.Toolbox) {
        console.warn('Toolbox Bridge not ready yet');
        return;
      }

      window.Toolbox.on('theme_change', (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
      });

      loadApps();
    }

    window.addEventListener('toolboxready', initBridge);
    if (window.Toolbox) initBridge();

    // Filters
    document.querySelectorAll('.btn-chip[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.getAttribute('data-filter');
        const val = btn.getAttribute('data-val');
        document.querySelectorAll(`.btn-chip[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (type === 'scope') filterScope = val;
        if (type === 'arch') filterArch = val;
        renderList();
      });
    });

    document.getElementById('check-show-system').addEventListener('change', (e) => {
      showSystem = e.target.checked;
      renderList();
    });

    document.getElementById('sort-select').addEventListener('change', (e) => {
      sortBy = e.target.value;
      renderList();
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderList();
    });

    document.getElementById('btn-refresh').addEventListener('click', loadApps);

    async function loadApps() {
      const container = document.getElementById('app-list-container');
      container.innerHTML = `
        <div class="center-state">
          <div class="spinner"></div>
          <p>正在读取 Windows 注册表已安装软件列表...</p>
        </div>
      `;

      try {
        const supported = await window.Toolbox.uninstaller.isSupported();
        if (!supported) {
          container.innerHTML = `<div class="center-state"><p style="color:var(--danger)">当前平台不支持 Windows 注册表软件卸载。</p></div>`;
          return;
        }

        const res = await window.Toolbox.uninstaller.loadApps();
        allApps = res.apps || [];
        renderList();

        // 异步增量拉取应用真实图标
        loadIconsInBatches(allApps);
      } catch (e) {
        container.innerHTML = `<div class="center-state"><p style="color:var(--danger)">加载失败: ${escapeHtml(e.message)}</p></div>`;
      }
    }

    async function loadIconsInBatches(apps) {
      try {
        const iconMap = await window.Toolbox.uninstaller.loadIcons(apps);
        if (!iconMap) return;
        for (const [id, path] of Object.entries(iconMap)) {
          const app = allApps.find(a => a.id === id);
          if (app) app.iconPath = path;
          const imgElem = document.getElementById(`icon-${id}`);
          if (imgElem && path) {
            imgElem.innerHTML = `<img src="${path.startsWith('http') ? path : 'file:///' + path.replace(/\\/g, '/')}" alt="icon" onerror="this.parentElement.innerHTML='${escapeHtml(app ? app.name.charAt(0) : '?')}'">`;
            imgElem.style.background = 'transparent';
          }
        }
      } catch (_) {}
    }

    function renderList() {
      const container = document.getElementById('app-list-container');
      let filtered = allApps.filter(app => {
        if (!showSystem && app.systemComponent) return false;
        if (filterScope !== 'all' && app.registryHive !== filterScope) return false;
        if (filterArch !== 'all' && app.registryView !== filterArch) return false;
        if (searchQuery) {
          const matchName = (app.name || '').toLowerCase().includes(searchQuery);
          const matchPub = (app.publisher || '').toLowerCase().includes(searchQuery);
          if (!matchName && !matchPub) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'name') return (a.name || '').localeCompare(b.name || '', 'zh-CN');
        if (sortBy === 'size') return (b.estimatedBytes || 0) - (a.estimatedBytes || 0);
        if (sortBy === 'date') return (b.installDate || '').localeCompare(a.installDate || '');
        return 0;
      });

      document.getElementById('app-count-badge').textContent = `共 ${filtered.length} 款软件`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="center-state"><p>未找到匹配的已安装软件</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(app => {
        const initial = app.name ? app.name.trim().charAt(0).toUpperCase() : '?';
        const squircleBg = getLettermarkGradient(app.name);
        return `
          <div class="app-card" onclick="openDetail('${app.id}')">
            <div class="app-info-col">
              <div class="app-icon" id="icon-${app.id}" style="background:${squircleBg}; color:#FFFFFF;">
                ${app.iconPath ? `<img src="file:///${app.iconPath.replace(/\\/g, '/')}" onerror="this.parentElement.textContent='${escapeHtml(initial)}'">` : escapeHtml(initial)}
              </div>
              <div class="app-details">
                <div class="app-name">${escapeHtml(app.name)}</div>
                <div class="app-meta">
                  <span>${escapeHtml(app.publisher || '未知开发者')}</span>
                  ${app.version ? `<span>版本: ${escapeHtml(app.version)}</span>` : ''}
                  ${app.formattedSize ? `<span class="badge">${escapeHtml(app.formattedSize)}</span>` : ''}
                  <span class="badge">${escapeHtml(app.scopeLabel)}</span>
                  <span class="badge">${escapeHtml(app.architecture)}</span>
                </div>
              </div>
            </div>
            <div class="app-actions" onclick="event.stopPropagation()">
              <button class="btn-action btn-secondary" onclick="openDetail('${app.id}')" style="padding:5px 12px;font-size:12.5px;">详情</button>
              <button class="btn-uninstall-row" ${app.canUninstall ? '' : 'disabled title="系统组件或无可用卸载命令"'} onclick="triggerUninstall('${app.id}')">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                <span>卸载</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openDetail(id) {
      currentApp = allApps.find(a => a.id === id);
      if (!currentApp) return;

      document.getElementById('modal-app-name').textContent = currentApp.name;
      document.getElementById('btn-modal-uninstall').disabled = !currentApp.canUninstall;

      const body = document.getElementById('modal-app-body');
      body.innerHTML = `
        <div class="meta-row">
          <div class="meta-label">软件名称</div>
          <div style="font-weight:700;font-size:14px;color:var(--text);">${escapeHtml(currentApp.name)}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">发布公司 / 开发者</div>
          <div>${escapeHtml(currentApp.publisher || '未提供')}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">安装绝对路径</div>
          <div class="meta-val">${escapeHtml(currentApp.installLocation || '注册表中未记录绝对安装路径')}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">官方卸载调用命令</div>
          <div class="meta-val">${escapeHtml(currentApp.uninstallString || (currentApp.windowsInstaller ? 'msiexec.exe /X ' + currentApp.registryKey : '无明确命令'))}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">注册表键路径</div>
          <div class="meta-val">${escapeHtml(currentApp.registryPath || '')}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">安装属性与环境</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <span class="badge">${escapeHtml(currentApp.scopeLabel)}</span>
            <span class="badge">${escapeHtml(currentApp.architecture)}</span>
            <span class="badge">体积: ${escapeHtml(currentApp.formattedSize)}</span>
            <span class="badge">安装日期: ${escapeHtml(currentApp.installDate || '未提供')}</span>
            ${currentApp.windowsInstaller ? '<span class="badge badge-primary">MSI 安装向导</span>' : ''}
          </div>
        </div>
      `;

      document.getElementById('btn-modal-uninstall').onclick = () => {
        triggerUninstall(currentApp.id);
      };

      document.getElementById('detail-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('show');
    }

    async function triggerUninstall(id) {
      const app = allApps.find(a => a.id === id);
      if (!app) return;
      closeModal();

      const asAdmin = document.getElementById('check-as-admin').checked;
      const confirm = await window.Toolbox.dialog.confirm(
        '确认卸载软件',
        `即将启动 [${app.name}] 的官方卸载向导。\n是否确认卸载？`
      );
      if (!confirm) return;

      window.Toolbox.system.showToast('正在启动官方卸载向导...', 'info');

      try {
        const res = await window.Toolbox.uninstaller.execute(app, asAdmin);
        window.Toolbox.system.showToast(res.message || '卸载向导已启动', res.succeeded ? 'success' : 'error');
        startResidueScan(app);
      } catch (e) {
        window.Toolbox.system.showToast('卸载启动失败: ' + e.message, 'error');
      }
    }

    async function startResidueScan(app) {
      currentApp = app;
      const listElem = document.getElementById('residue-items-list');
      listElem.innerHTML = `<div class="center-state"><div class="spinner"></div><p>正在深度扫描磁盘残留文件与注册表废弃配置...</p></div>`;
      document.getElementById('residue-modal').classList.add('show');

      try {
        residueCandidates = await window.Toolbox.uninstaller.scanResidues(app);
        if (!residueCandidates || residueCandidates.length === 0) {
          listElem.innerHTML = `<p style="padding:16px;text-align:center;color:var(--success);font-weight:600;">✅ 未发现已知磁盘或注册表残留项，卸载非常干净！</p>`;
          return;
        }

        listElem.innerHTML = residueCandidates.map((c, idx) => `
          <label class="residue-item">
            <input type="checkbox" data-idx="${idx}">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:600;color:var(--text);font-family:monospace;font-size:12px;word-break:break-all;">${escapeHtml(c.path)}</div>
              <div style="color:var(--text-muted);font-size:11px;margin-top:2px;">[${escapeHtml(c.kind)}] ${escapeHtml(c.note || '')}</div>
            </div>
          </label>
        `).join('');
      } catch (e) {
        listElem.innerHTML = `<p style="color:var(--danger)">残留扫描失败: ${escapeHtml(e.message)}</p>`;
      }
    }

    function toggleAllResidues(check) {
      document.querySelectorAll('#residue-items-list input[type="checkbox"]').forEach(cb => cb.checked = check);
    }

    function closeResidueModal() {
      document.getElementById('residue-modal').classList.remove('show');
      loadApps();
    }

    async function executeCleanResidues() {
      const selected = [];
      document.querySelectorAll('#residue-items-list input[type="checkbox"]:checked').forEach(cb => {
        const idx = parseInt(cb.getAttribute('data-idx'));
        if (residueCandidates[idx]) selected.push(residueCandidates[idx]);
      });

      if (selected.length === 0) {
        window.Toolbox.system.showToast('请至少勾选一项残留进行清理', 'info');
        return;
      }

      const confirm = await window.Toolbox.dialog.confirm(
        '确认永久清理残留',
        `已勾选 ${selected.length} 项残留文件/注册表项。\n删除后不可恢复，是否确认清理？`
      );
      if (!confirm) return;

      try {
        const res = await window.Toolbox.uninstaller.cleanResidues(selected);
        if (res.succeeded) {
          window.Toolbox.system.showToast(`成功清理 ${res.deletedPaths.length} 项残留`, 'success');
        } else {
          window.Toolbox.system.showToast(`部分清理失败: ${res.errors.join('; ')}`, 'warning');
        }
        closeResidueModal();
      } catch (e) {
        window.Toolbox.system.showToast('清理异常: ' + e.message, 'error');
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
