<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软件卸载 - Windows Uninstaller</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --card-hover: #273549;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --warning: #f59e0b;
      --badge-bg: #334155;
      --modal-bg: rgba(15, 23, 42, 0.85);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: #e2e8f0;
      --modal-bg: rgba(241, 245, 249, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
    }

    .brand svg {
      width: 24px;
      height: 24px;
      stroke: var(--primary);
    }

    .search-bar {
      flex: 1;
      max-width: 480px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--primary);
    }

    .search-bar svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-chip {
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .btn-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      font-weight: 500;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }

    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-danger {
      background: var(--danger);
    }
    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .btn-secondary {
      background: var(--card-border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: var(--card-hover);
    }

    select {
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    /* List Container */
    #app-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.1s, border-color 0.1s;
    }

    .app-card:hover {
      background: var(--card-hover);
      border-color: var(--primary);
    }

    .app-info-col {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .app-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: var(--primary);
      flex-shrink: 0;
      overflow: hidden;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .app-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .app-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      background: var(--badge-bg);
      color: var(--text-muted);
    }

    .badge-primary {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
    }

    .app-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Modal / Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-dialog {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 90%;
      max-width: 620px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close {
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      line-height: 1;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-label {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-val {
      font-family: monospace;
      font-size: 12px;
      background: var(--bg);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      word-break: break-all;
    }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Residue list */
    .residue-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      font-size: 12px;
      word-break: break-all;
    }

    .residue-item input[type="checkbox"] {
      margin-top: 3px;
    }

    /* Empty state & Loading */
    .center-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      gap: 12px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--card-border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8m-4-5v5M8 8l3 3m0-3-3 3m6-3h3m-3 3h3"/></svg>
        <span>软件卸载</span>
        <span class="badge badge-primary" id="app-count-badge">0</span>
      </div>

      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="搜索已安装软件名称或发布者...">
      </div>

      <button class="btn-action" id="btn-refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span>刷新</span>
      </button>
    </div>

    <div class="controls-row">
      <div class="filter-group">
        <span style="color:var(--text-muted);">范围:</span>
        <button class="btn-chip active" data-filter="scope" data-val="all">全部</button>
        <button class="btn-chip" data-filter="scope" data-val="CurrentUser">当前用户</button>
        <button class="btn-chip" data-filter="scope" data-val="LocalMachine">所有用户</button>
      </div>

      <div class="filter-group">
        <span style="color:var(--text-muted);">架构:</span>
        <button class="btn-chip active" data-filter="arch" data-val="all">全部</button>
        <button class="btn-chip" data-filter="arch" data-val="Registry64">64 位</button>
        <button class="btn-chip" data-filter="arch" data-val="Registry32">32 位</button>
      </div>

      <div class="filter-group">
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
          <input type="checkbox" id="check-show-system">
          <span style="color:var(--text-muted);">显示系统组件</span>
        </label>
      </div>

      <div class="filter-group" style="margin-left:auto;">
        <span style="color:var(--text-muted);">排序:</span>
        <select id="sort-select">
          <option value="name">名称 (A-Z)</option>
          <option value="size">占用大小 (大到小)</option>
          <option value="date">安装日期 (最新)</option>
        </select>
      </div>
    </div>
  </header>

  <div id="app-list-container">
    <div class="center-state">
      <div class="spinner"></div>
      <p>正在读取 Windows 注册表已安装软件列表...</p>
    </div>
  </div>

  <!-- Detail & Action Modal -->
  <div class="modal-backdrop" id="detail-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title" id="modal-app-name">软件详情</div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-app-body">
        <!-- Injected dynamically -->
      </div>
      <div class="modal-footer">
        <label style="margin-right:auto;display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="check-as-admin">
          <span>以管理员身份卸载</span>
        </label>
        <button class="btn-action btn-secondary" onclick="closeModal()">关闭</button>
        <button class="btn-action btn-danger" id="btn-modal-uninstall">启动官方卸载</button>
      </div>
    </div>
  </div>

  <!-- Residue Scanner Modal -->
  <div class="modal-backdrop" id="residue-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">卸载残留扫描</div>
        <button class="modal-close" onclick="closeResidueModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-muted);">以下为该程序在本地磁盘与注册表可能留下的残留。默认不勾选，请仔细核对后勾选需要清理的项目：</p>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button class="btn-chip" onclick="toggleAllResidues(true)">全选</button>
          <button class="btn-chip" onclick="toggleAllResidues(false)">取消全选</button>
        </div>
        <div id="residue-items-list" style="display:flex;flex-direction:column;gap:6px;">
          <!-- Dynamically populated -->
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-secondary" onclick="closeResidueModal()">跳过残留清理</button>
        <button class="btn-action btn-danger" id="btn-clean-residues" onclick="executeCleanResidues()">永久删除所选残留</button>
      </div>
    </div>
  </div>

  <script>
    let allApps = [];
    let currentApp = null;
    let residueCandidates = [];
    let filterScope = 'all';
    let filterArch = 'all';
    let showSystem = false;
    let sortBy = 'name';
    let searchQuery = '';

    // 初始化 Bridge
    function initBridge() {
      if (!window.Toolbox) {
        console.warn('Toolbox Bridge not ready yet');
        return;
      }

      window.Toolbox.on('theme_change', (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
      });

      loadApps();
    }

    window.addEventListener('toolboxready', initBridge);
    if (window.Toolbox) initBridge();

    // 筛选按钮事件
    document.querySelectorAll('.btn-chip[data-filter]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const type = btn.getAttribute('data-filter');
        const val = btn.getAttribute('data-val');
        document.querySelectorAll(`.btn-chip[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (type === 'scope') filterScope = val;
        if (type === 'arch') filterArch = val;
        renderList();
      });
    });

    document.getElementById('check-show-system').addEventListener('change', (e) => {
      showSystem = e.target.checked;
      renderList();
    });

    document.getElementById('sort-select').addEventListener('change', (e) => {
      sortBy = e.target.value;
      renderList();
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderList();
    });

    document.getElementById('btn-refresh').addEventListener('click', loadApps);

    async function loadApps() {
      const container = document.getElementById('app-list-container');
      container.innerHTML = `
        <div class="center-state">
          <div class="spinner"></div>
          <p>正在读取 Windows 注册表已安装软件列表...</p>
        </div>
      `;

      try {
        const supported = await window.Toolbox.uninstaller.isSupported();
        if (!supported) {
          container.innerHTML = `<div class="center-state"><p style="color:var(--danger)">当前平台不支持 Windows 注册表软件卸载。</p></div>`;
          return;
        }

        const res = await window.Toolbox.uninstaller.loadApps();
        allApps = res.apps || [];
        renderList();

        // 异步增量拉取应用图标
        loadIconsInBatches(allApps);
      } catch (e) {
        container.innerHTML = `<div class="center-state"><p style="color:var(--danger)">加载失败: ${e.message}</p></div>`;
      }
    }

    async function loadIconsInBatches(apps) {
      try {
        const iconMap = await window.Toolbox.uninstaller.loadIcons(apps);
        if (!iconMap) return;
        for (const [id, path] of Object.entries(iconMap)) {
          const app = allApps.find(a => a.id === id);
          if (app) app.iconPath = path;
          const imgElem = document.getElementById(`icon-${id}`);
          if (imgElem && path) {
            imgElem.innerHTML = `<img src="${path.startsWith('http') ? path : 'file:///' + path.replace(/\\/g, '/')}" alt="icon" onerror="this.parentElement.textContent='${escapeHtml(app ? app.name.charAt(0) : '?')}'">`;
          }
        }
      } catch (_) {}
    }

    function renderList() {
      const container = document.getElementById('app-list-container');
      let filtered = allApps.filter(app => {
        if (!showSystem && app.systemComponent) return false;
        if (filterScope !== 'all' && app.registryHive !== filterScope) return false;
        if (filterArch !== 'all' && app.registryView !== filterArch) return false;
        if (searchQuery) {
          const matchName = (app.name || '').toLowerCase().includes(searchQuery);
          const matchPub = (app.publisher || '').toLowerCase().includes(searchQuery);
          if (!matchName && !matchPub) return false;
        }
        return true;
      });

      // 排序
      filtered.sort((a, b) => {
        if (sortBy === 'name') return (a.name || '').localeCompare(b.name || '', 'zh-CN');
        if (sortBy === 'size') return (b.estimatedBytes || 0) - (a.estimatedBytes || 0);
        if (sortBy === 'date') return (b.installDate || '').localeCompare(a.installDate || '');
        return 0;
      });

      document.getElementById('app-count-badge').textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="center-state"><p>未找到匹配的软件</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(app => {
        const initial = app.name ? app.name.trim().charAt(0).toUpperCase() : '?';
        return `
          <div class="app-card" onclick="openDetail('${app.id}')">
            <div class="app-info-col">
              <div class="app-icon" id="icon-${app.id}">
                ${app.iconPath ? `<img src="file:///${app.iconPath.replace(/\\/g, '/')}" onerror="this.parentElement.textContent='${escapeHtml(initial)}'">` : escapeHtml(initial)}
              </div>
              <div class="app-details">
                <div class="app-name">${escapeHtml(app.name)}</div>
                <div class="app-meta">
                  <span>${escapeHtml(app.publisher || '未知发布者')}</span>
                  ${app.version ? `<span>版本: ${escapeHtml(app.version)}</span>` : ''}
                  ${app.formattedSize ? `<span class="badge">${escapeHtml(app.formattedSize)}</span>` : ''}
                  <span class="badge">${escapeHtml(app.scopeLabel)}</span>
                  <span class="badge">${escapeHtml(app.architecture)}</span>
                </div>
              </div>
            </div>
            <div class="app-actions" onclick="event.stopPropagation()">
              <button class="btn-action btn-secondary" onclick="openDetail('${app.id}')">详情</button>
              <button class="btn-action btn-danger" ${app.canUninstall ? '' : 'disabled title="系统组件或无可用卸载命令"'} onclick="triggerUninstall('${app.id}')">卸载</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openDetail(id) {
      currentApp = allApps.find(a => a.id === id);
      if (!currentApp) return;

      document.getElementById('modal-app-name').textContent = currentApp.name;
      document.getElementById('btn-modal-uninstall').disabled = !currentApp.canUninstall;

      const body = document.getElementById('modal-app-body');
      body.innerHTML = `
        <div class="meta-row">
          <div class="meta-label">软件名称</div>
          <div style="font-weight:600;">${escapeHtml(currentApp.name)}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">发布公司 / 开发者</div>
          <div>${escapeHtml(currentApp.publisher || '未提供')}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">安装位置</div>
          <div class="meta-val">${escapeHtml(currentApp.installLocation || '未记录绝对安装路径')}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">官方卸载命令</div>
          <div class="meta-val">${escapeHtml(currentApp.uninstallString || (currentApp.windowsInstaller ? 'msiexec.exe /X ' + currentApp.registryKey : '无明确命令'))}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">注册表键路径</div>
          <div class="meta-val">${escapeHtml(currentApp.registryPath || '')}</div>
        </div>
        <div class="meta-row">
          <div class="meta-label">属性信息</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <span class="badge">${escapeHtml(currentApp.scopeLabel)}</span>
            <span class="badge">${escapeHtml(currentApp.architecture)}</span>
            <span class="badge">体积: ${escapeHtml(currentApp.formattedSize)}</span>
            <span class="badge">安装日期: ${escapeHtml(currentApp.installDate || '未提供')}</span>
            ${currentApp.windowsInstaller ? '<span class="badge badge-primary">MSI 安装包</span>' : ''}
          </div>
        </div>
      `;

      document.getElementById('btn-modal-uninstall').onclick = () => {
        triggerUninstall(currentApp.id);
      };

      document.getElementById('detail-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('show');
    }

    async function triggerUninstall(id) {
      const app = allApps.find(a => a.id === id);
      if (!app) return;
      closeModal();

      const asAdmin = document.getElementById('check-as-admin').checked;
      const confirm = await window.Toolbox.dialog.confirm(
        '确认卸载软件',
        `即将启动 [${app.name}] 的官方卸载向导。\n是否确认卸载？`
      );
      if (!confirm) return;

      window.Toolbox.system.showToast('正在启动官方卸载向导...', 'info');

      try {
        const res = await window.Toolbox.uninstaller.execute(app, asAdmin);
        window.Toolbox.system.showToast(res.message || '卸载流程已触发', res.succeeded ? 'success' : 'error');

        // 提示进行残留扫描
        startResidueScan(app);
      } catch (e) {
        window.Toolbox.system.showToast('卸载启动失败: ' + e.message, 'error');
      }
    }

    async function startResidueScan(app) {
      currentApp = app;
      const listElem = document.getElementById('residue-items-list');
      listElem.innerHTML = `<div class="center-state"><div class="spinner"></div><p>正在深度扫描磁盘残留文件与注册表废弃配置...</p></div>`;
      document.getElementById('residue-modal').classList.add('show');

      try {
        residueCandidates = await window.Toolbox.uninstaller.scanResidues(app);
        if (!residueCandidates || residueCandidates.length === 0) {
          listElem.innerHTML = `<p style="padding:16px;text-align:center;color:var(--success);">✅ 未发现已知磁盘或注册表残留项，清理非常彻底！</p>`;
          return;
        }

        listElem.innerHTML = residueCandidates.map((c, idx) => `
          <label class="residue-item">
            <input type="checkbox" data-idx="${idx}">
            <div style="flex:1;">
              <div style="font-weight:500;color:var(--text);">${escapeHtml(c.path)}</div>
              <div style="color:var(--text-muted);font-size:11px;">[${escapeHtml(c.kind)}] ${escapeHtml(c.note || '')}</div>
            </div>
          </label>
        `).join('');
      } catch (e) {
        listElem.innerHTML = `<p style="color:var(--danger)">残留扫描失败: ${e.message}</p>`;
      }
    }

    function toggleAllResidues(check) {
      document.querySelectorAll('#residue-items-list input[type="checkbox"]').forEach(cb => cb.checked = check);
    }

    function closeResidueModal() {
      document.getElementById('residue-modal').classList.remove('show');
      loadApps(); // 刷新软件列表
    }

    async function executeCleanResidues() {
      const selected = [];
      document.querySelectorAll('#residue-items-list input[type="checkbox"]:checked').forEach(cb => {
        const idx = parseInt(cb.getAttribute('data-idx'));
        if (residueCandidates[idx]) selected.push(residueCandidates[idx]);
      });

      if (selected.length === 0) {
        window.Toolbox.system.showToast('请至少选择一项残留进行清理', 'info');
        return;
      }

      const confirm = await window.Toolbox.dialog.confirm(
        '确认永久清理残留',
        `已选择 ${selected.length} 项残留文件/注册表项。\n删除后不可恢复，是否确认清理？`
      );
      if (!confirm) return;

      try {
        const res = await window.Toolbox.uninstaller.cleanResidues(selected);
        if (res.succeeded) {
          window.Toolbox.system.showToast(`成功清理 ${res.deletedPaths.length} 项残留`, 'success');
        } else {
          window.Toolbox.system.showToast(`部分清理失败: ${res.errors.join('; ')}`, 'warning');
        }
        closeResidueModal();
      } catch (e) {
        window.Toolbox.system.showToast('清理异常: ' + e.message, 'error');
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
