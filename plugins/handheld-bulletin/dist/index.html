<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>手持弹幕举牌 - LED Banner</title>
  <style>
    :root {
      --bg-dark: #090D16;
      --surface-dark: #131A29;
      --surface-elevated: #1C263B;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.2);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #06B6D4;
      --accent-hover: #0891B2;
      --accent-glow: rgba(6, 182, 212, 0.25);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-full: 9999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-sans);
      color: var(--text-main);
    }

    #stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      background-color: #000000;
      transition: background-color 0.2s ease;
    }

    #marquee-container {
      display: inline-block;
      white-space: pre;
      line-height: 1.15;
      font-weight: 800;
      text-align: center;
      transition: opacity 0.2s;
      will-change: transform;
    }

    .led-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(rgba(0, 0, 0, 0.45) 18%, transparent 19%) 0 0,
                  radial-gradient(rgba(0, 0, 0, 0.45) 18%, transparent 19%) 4px 4px;
      background-size: 8px 8px;
      display: none;
      z-index: 5;
    }

    /* Floating Capsule Toolbar */
    #toolbar {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(19, 26, 41, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 6px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      z-index: 100;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #toolbar::-webkit-scrollbar {
      display: none;
    }

    #toolbar.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-24px);
      pointer-events: none;
    }

    .tb-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F8FAFC;
      padding: 7px 13px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .tb-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .tb-btn:active {
      transform: scale(0.96);
    }

    .tb-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Tap Stage Floating Hint */
    #tap-hint {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 11.5px;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.5s ease;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    #tap-hint.fade-out {
      opacity: 0;
    }

    /* Modal Drawer */
    #drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 110;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    #drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface-dark);
      border-top: 1px solid var(--border-subtle);
      border-radius: 20px 20px 0 0;
      padding: 16px 20px max(20px, env(safe-area-inset-bottom));
      max-height: 85vh;
      overflow-y: auto;
      z-index: 120;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #drawer.open {
      transform: translateY(0);
    }

    .drawer-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      margin: 0 auto 4px auto;
      flex-shrink: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-title svg {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }

    .btn-finish {
      background: var(--accent);
      color: #090D16;
      border: none;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-finish:hover {
      background: var(--accent-hover);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .text-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: #FFFFFF;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      resize: vertical;
      min-height: 56px;
      transition: border-color 0.2s;
    }

    .text-input:focus {
      border-color: var(--accent);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .opt-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }

    .opt-btn.active {
      background: rgba(6, 182, 212, 0.18);
      color: #38BDF8;
      border-color: #38BDF8;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .val-chip {
      font-size: 12px;
      font-family: monospace;
      color: var(--accent);
      background: rgba(6, 182, 212, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Color Swatch Arrays (8 Curated Colors) */
    .color-swatches-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .swatch-item {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
      flex-shrink: 0;
    }

    .swatch-item:hover {
      transform: scale(1.1);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .swatch-item.active {
      transform: scale(1.15);
      border-color: #FFFFFF;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .swatch-item.active::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
    }

    /* Inline Color Customizer (No Native Popup) */
    .inline-color-customizer {
      margin-top: 8px;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .customizer-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-preview-chip {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .hex-input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      color: #FFFFFF;
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      width: 100px;
      outline: none;
    }

    .hex-input:focus {
      border-color: var(--accent);
    }

    .rgb-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .rgb-slider {
      flex: 1;
      height: 4px;
      accent-color: var(--accent);
    }

    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
  </style>
</head>
<body>

  <!-- Screen Stage -->
  <div id="stage">
    <div id="marquee-container">很高兴遇见你！</div>
    <div class="led-overlay" id="led-mask"></div>
  </div>

  <!-- Top Floating Capsule Toolbar -->
  <div id="toolbar">
    <button class="tb-btn" id="btn-toggle-play">

    <button class="tb-btn" id="btn-edit">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      <span>设置</span>
    </button>
    <button class="tb-btn" id="btn-fullscreen">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      <span id="text-fullscreen">全屏</span>
    </button>
  </div>

  <!-- Tap Stage Floating Hint -->
  <div id="tap-hint">轻触屏幕任意位置可唤出控制栏</div>

  <!-- Settings Drawer Backdrop -->
  <div id="drawer-backdrop"></div>

  <!-- Settings Drawer -->
  <div id="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <div class="drawer-title">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2zm0-10h2v8h-2z"/></svg>
        <span>弹幕与举牌设置</span>
      </div>
      <button class="btn-finish" id="btn-close-drawer">完成</button>
    </div>

    <!-- Text Input -->
    <div class="form-group">
      <label class="form-label">举牌文字内容</label>
      <textarea class="text-input" id="input-text" placeholder="输入举牌文字或欢迎标语...">很高兴遇见你！</textarea>
    </div>

    <!-- Presets -->
    <div class="form-group">
      <label class="form-label">经典场景预设</label>
      <div class="btn-group" id="presets-group">
        <button class="opt-btn" data-preset="airport">🛫 机场接机</button>
        <button class="opt-btn" data-preset="idol">🎤 演唱应援</button>
        <button class="opt-btn" data-preset="love">💖 浪漫告白</button>
        <button class="opt-btn" data-preset="market">🏮 招牌集市</button>
        <button class="opt-btn" data-preset="warning">⚠️ 警示通告</button>
      </div>
    </div>

    <!-- Direction -->
    <div class="form-group">
      <label class="form-label">滚动方向</label>
      <div class="btn-group" id="direction-group">
        <button class="opt-btn" data-dir="left">← 向左滚动</button>
        <button class="opt-btn" data-dir="right">→ 向右滚动</button>
        <button class="opt-btn" data-dir="up">↑ 向上滚动</button>
        <button class="opt-btn" data-dir="down">↓ 向下滚动</button>
        <button class="opt-btn" data-dir="still">⏸️ 静止居中</button>
      </div>
    </div>

    <!-- Speed Slider -->
    <div class="form-group">
      <div class="form-label">
        <span>滚动速度</span>
        <span class="val-chip" id="label-speed">100</span>
      </div>
      <div class="slider-row">
        <input type="range" class="slider" id="slider-speed" min="20" max="400" value="100">
      </div>
    </div>

    <!-- Font Size Slider -->
    <div class="form-group">
      <div class="form-label">
        <span>文字字号</span>
        <span class="val-chip" id="label-size">112 px</span>
      </div>
      <div class="slider-row">
        <input type="range" class="slider" id="slider-size" min="30" max="300" value="112">
      </div>
    </div>

    <!-- Text Color (Swatches + In-page Customizer) -->
    <div class="form-group">
      <label class="form-label">文字颜色</label>
      <div class="color-swatches-grid" id="text-color-swatches">
        <div class="swatch-item active" style="background:#06B6D4" data-color="#06B6D4"></div>
        <div class="swatch-item" style="background:#38BDF8" data-color="#38BDF8"></div>
        <div class="swatch-item" style="background:#F43F5E" data-color="#F43F5E"></div>
        <div class="swatch-item" style="background:#FACC15" data-color="#FACC15"></div>
        <div class="swatch-item" style="background:#10B981" data-color="#10B981"></div>
        <div class="swatch-item" style="background:#A855F7" data-color="#A855F7"></div>
        <div class="swatch-item" style="background:#FFFFFF" data-color="#FFFFFF"></div>
        <div class="swatch-item" style="background:#FFA500" data-color="#FFA500"></div>
      </div>
      <!-- Inline Customizer for Text Color -->
      <div class="inline-color-customizer">

          <div class="color-preview-chip" id="text-preview-chip" style="background:#06B6D4;"></div>
          <span style="font-size:12px;color:var(--text-muted);">自定义HEX:</span>
          <input type="text" class="hex-input" id="hex-text-color" value="#06B6D4" maxlength="7">
        </div>
        <div class="rgb-row">
          <span>R</span><input type="range" class="rgb-slider" id="text-r" min="0" max="255" value="6">
          <span>G</span><input type="range" class="rgb-slider" id="text-g" min="0" max="255" value="182">
          <span>B</span><input type="range" class="rgb-slider" id="text-b" min="0" max="255" value="212">
        </div>
      </div>
    </div>

    <!-- Background Color (Swatches + In-page Customizer) -->
    <div class="form-group">
      <label class="form-label">背景底色</label>
      <div class="color-swatches-grid" id="bg-color-swatches">
        <div class="swatch-item active" style="background:#000000" data-color="#000000"></div>
        <div class="swatch-item" style="background:#090D16" data-color="#090D16"></div>
        <div class="swatch-item" style="background:#1A0022" data-color="#1A0022"></div>
        <div class="swatch-item" style="background:#001824" data-color="#001824"></div>
        <div class="swatch-item" style="background:#2A0808" data-color="#2A0808"></div>
        <div class="swatch-item" style="background:#062817" data-color="#062817"></div>
        <div class="swatch-item" style="background:#18181B" data-color="#18181B"></div>
        <div class="swatch-item" style="background:#1E293B" data-color="#1E293B"></div>
      </div>
      <!-- Inline Customizer for Bg Color -->
      <div class="inline-color-customizer">
        <div class="customizer-row">
          <div class="color-preview-chip" id="bg-preview-chip" style="background:#000000;"></div>
          <span style="font-size:12px;color:var(--text-muted);">自定义HEX:</span>
          <input type="text" class="hex-input" id="hex-bg-color" value="#000000" maxlength="7">
        </div>
        <div class="rgb-row">
          <span>R</span><input type="range" class="rgb-slider" id="bg-r" min="0" max="255" value="0">
          <span>G</span><input type="range" class="rgb-slider" id="bg-g" min="0" max="255" value="0">
          <span>B</span><input type="range" class="rgb-slider" id="bg-b" min="0" max="255" value="0">
        </div>
      </div>
    </div>

    <!-- Visual Effects -->
    <div class="form-group">
      <label class="form-label">视觉特效与样式</label>
      <div class="btn-group">
        <button class="opt-btn" id="btn-fx-glow">🌟 霓虹辉光</button>
        <button class="opt-btn" id="btn-fx-stroke">🔲 文字描边</button>
        <button class="opt-btn" id="btn-fx-led">💡 LED点阵</button>

      </div>
    </div>
  </div>

  <script>
    // State Store
    const state = {
      text: '很高兴遇见你！',
      fontSize: 112,
      speed: 100,
      textColor: '#06B6D4',
      bgColor: '#000000',
      direction: 'left',
      glow: true,
      stroke: false,

    const stage = document.getElementById('stage');
    const toolbar = document.getElementById('toolbar');
    const drawer = document.getElementById('drawer');
    const drawerBackdrop = document.getElementById('drawer-backdrop');
    const ledMask = document.getElementById('led-mask');
    const tapHint = document.getElementById('tap-hint');

    let animFrame = null;
    let lastTime = performance.now();
    let hideTimer = null;

    // Presets
    const PRESETS = {
      airport: {

        stroke: false,
        led: false,

        speed: 90,
        textColor: '#06B6D4',
        bgColor: '#000000',
        direction: 'left',
        glow: true,
        stroke: false,
        led: true,
        flash: false
      },
      warning: {
        text: '⚠️ 前方施工 请减速慢行 ⚠️',
        fontSize: 130,
        speed: 0,
        textColor: '#FACC15',
        bgColor: '#000000',
        direction: 'still',
        glow: true,
        stroke: true,
        led: false,
        flash: true
      }
    };

    function applyState() {
      container.textContent = state.text;
      container.style.fontSize = state.fontSize + 'px';
      container.style.color = state.textColor;
      stage.style.backgroundColor = state.bgColor;

      if (state.glow) {
        container.style.textShadow = `0 0 10px ${state.textColor}, 0 0 25px ${state.textColor}, 0 0 50px ${state.textColor}`;
      } else {
        container.style.textShadow = 'none';
      }

      if (state.stroke) {
        container.style.webkitTextStroke = '2px #FFFFFF';
      } else {
        container.style.webkitTextStroke = '0';
      }

      ledMask.style.display = state.led ? 'block' : 'none';

      const mirrorScale = state.mirror ? -1 : 1;
      container.style.transformOrigin = 'center center';

      if (state.flash) {
        container.style.animation = 'flash 1.2s infinite ease-in-out';
      } else {
        container.style.animation = 'none';
      }

      // Sync form controls
      document.getElementById('input-text').value = state.text;
      document.getElementById('slider-speed').value = state.speed;
      document.getElementById('label-speed').textContent = state.speed;
      document.getElementById('slider-size').value = state.fontSize;
      document.getElementById('label-size').textContent = state.fontSize + ' px';

      // Update button active states
      document.querySelectorAll('#direction-group .opt-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.dir === state.direction);
      });
      document.getElementById('btn-fx-glow').classList.toggle('active', state.glow);
      document.getElementById('btn-fx-stroke').classList.toggle('active', state.stroke);
      document.getElementById('btn-fx-led').classList.toggle('active', state.led);
      document.getElementById('btn-fx-mirror').classList.toggle('active', state.mirror);
      document.getElementById('btn-fx-flash').classList.toggle('active', state.flash);

      // Update color swatches active states
      document.querySelectorAll('#text-color-swatches .swatch-item').forEach(sw => {
        sw.classList.toggle('active', sw.dataset.color.toLowerCase() === state.textColor.toLowerCase());
      });
      document.querySelectorAll('#bg-color-swatches .swatch-item').forEach(sw => {
        sw.classList.toggle('active', sw.dataset.color.toLowerCase() === state.bgColor.toLowerCase());
      });

      // Update custom color chips & inputs
      document.getElementById('text-preview-chip').style.backgroundColor = state.textColor;
      document.getElementById('hex-text-color').value = state.textColor;
      syncRgbSliders('text', state.textColor);

      document.getElementById('bg-preview-chip').style.backgroundColor = state.bgColor;
      document.getElementById('hex-bg-color').value = state.bgColor;
      syncRgbSliders('bg', state.bgColor);

      resetPositions();
    }

    function syncRgbSliders(type, hex) {
      const rgb = hexToRgb(hex);
      if (rgb) {
        document.getElementById(`${type}-r`).value = rgb.r;
        document.getElementById(`${type}-g`).value = rgb.g;
        document.getElementById(`${type}-b`).value = rgb.b;
      }
    }

    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) {
        hex = hex.split('').map(c => c + c).join('');
      }
      if (hex.length !== 6) return null;
      const num = parseInt(hex, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function rgbToHex(r, g, b) {
      const toHex = n => {
        const h = Math.max(0, Math.min(255, n)).toString(16);
        return h.length === 1 ? '0' + h : h;
      };
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    function resetPositions() {
      const stageW = stage.clientWidth;
      const stageH = stage.clientHeight;
      const elemW = container.offsetWidth;
      const elemH = container.offsetHeight;

      if (state.direction === 'left') {
        state.posX = stageW;
        state.posY = 0;
      } else if (state.direction === 'right') {
        state.posX = -elemW;
        state.posY = 0;
      } else if (state.direction === 'up') {
        state.posX = 0;
        state.posY = stageH;
      } else if (state.direction === 'down') {
        state.posX = 0;
        state.posY = -elemH;
      } else {
        state.posX = 0;
        state.posY = 0;
      }
      renderMarqueeTransform();
    }

    function renderMarqueeTransform() {
      const mirrorScale = state.mirror ? -1 : 1;
      container.style.transform = `translate3d(${state.posX}px, ${state.posY}px, 0) scaleX(${mirrorScale})`;
    }

    function loop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (!state.paused && state.direction !== 'still') {
        const step = state.speed * dt * 2.2;
        const stageW = stage.clientWidth;
        const stageH = stage.clientHeight;
        const elemW = container.offsetWidth;
        const elemH = container.offsetHeight;

        if (state.direction === 'left') {
          state.posX -= step;
          if (state.posX < -elemW) {
            state.posX = stageW;
          }
        } else if (state.direction === 'right') {
          state.posX += step;
          if (state.posX > stageW) {
            state.posX = -elemW;
          }
        } else if (state.direction === 'up') {
          state.posY -= step;
          if (state.posY < -elemH) {
            state.posY = stageH;
          }
        } else if (state.direction === 'down') {
          state.posY += step;
          if (state.posY > stageH) {
            state.posY = -elemH;
          }
        }
        renderMarqueeTransform();
      }

      animFrame = requestAnimationFrame(loop);
    }

    // Auto Hide Toolbar
    function triggerToolbarVisibility() {
      toolbar.classList.remove('hidden');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!drawer.classList.contains('open')) {
          toolbar.classList.add('hidden');
        }
      }, 4000);
    }

    // Event Handlers
    stage.addEventListener('click', (e) => {
      if (drawer.classList.contains('open')) return;
      if (toolbar.classList.contains('hidden')) {
        triggerToolbarVisibility();
      } else {
        toolbar.classList.add('hidden');
      }
      tapHint.classList.add('fade-out');
    });

    document.getElementById('btn-toggle-play').addEventListener('click', (e) => {
      e.stopPropagation();
      state.paused = !state.paused;
      const playIcon = document.getElementById('icon-play-state');
      const playText = document.getElementById('text-play-state');
      if (state.paused) {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        playText.textContent = '播放';
      } else {
        playIcon.innerHTML = '<path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>';
        playText.textContent = '暂停';
      }
      triggerToolbarVisibility();
    });

    function openDrawer() {
      drawer.classList.add('open');
      drawerBackdrop.classList.add('open');
      toolbar.classList.remove('hidden');
      clearTimeout(hideTimer);
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      drawerBackdrop.classList.remove('open');
      triggerToolbarVisibility();
    }

    document.getElementById('btn-edit').addEventListener('click', (e) => {
      e.stopPropagation();
      openDrawer();
    });

    document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);

    // Fullscreen Toggle
    document.getElementById('btn-fullscreen').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.Toolbox && window.Toolbox.system && window.Toolbox.system.toggleFullscreen) {
        window.Toolbox.system.toggleFullscreen();
      } else {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
      triggerToolbarVisibility();
    });

    // Inputs
    document.getElementById('input-text').addEventListener('input', (e) => {
      state.text = e.target.value || ' ';
      applyState();
    });

    document.getElementById('slider-speed').addEventListener('input', (e) => {
      state.speed = parseInt(e.target.value);
      document.getElementById('label-speed').textContent = state.speed;
    });

    document.getElementById('slider-size').addEventListener('input', (e) => {
      state.fontSize = parseInt(e.target.value);
      document.getElementById('label-size').textContent = state.fontSize + ' px';
      container.style.fontSize = state.fontSize + 'px';
      resetPositions();
    });

    // Preset Selection
    document.getElementById('presets-group').addEventListener('click', (e) => {
      const btn = e.target.closest('.opt-btn');
      if (!btn) return;
      const p = PRESETS[btn.dataset.preset];
      if (p) {
        Object.assign(state, p);
        applyState();
      }
    });

    // Direction Selection
    document.getElementById('direction-group').addEventListener('click', (e) => {
      const btn = e.target.closest('.opt-btn');
      if (!btn) return;
      state.direction = btn.dataset.dir;
      applyState();
    });

    // Swatches
    document.getElementById('text-color-swatches').addEventListener('click', (e) => {
      const sw = e.target.closest('.swatch-item');
      if (!sw) return;
      state.textColor = sw.dataset.color;
      applyState();
    });

    document.getElementById('bg-color-swatches').addEventListener('click', (e) => {
      const sw = e.target.closest('.swatch-item');
      if (!sw) return;
      state.bgColor = sw.dataset.color;
      applyState();
    });

    // Text Color RGB & Hex
    function updateTextColorFromRgb() {
      const r = parseInt(document.getElementById('text-r').value);
      const g = parseInt(document.getElementById('text-g').value);
      const b = parseInt(document.getElementById('text-b').value);
      state.textColor = rgbToHex(r, g, b);
      applyState();
    }

    ['text-r', 'text-g', 'text-b'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateTextColorFromRgb);
    });

    document.getElementById('hex-text-color').addEventListener('change', (e) => {
      let v = e.target.value.trim();
      if (!v.startsWith('#')) v = '#' + v;
      if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
        state.textColor = v.toUpperCase();
        applyState();
      }
    });

    // Bg Color RGB & Hex
    function updateBgColorFromRgb() {
      const r = parseInt(document.getElementById('bg-r').value);
      const g = parseInt(document.getElementById('bg-g').value);
      const b = parseInt(document.getElementById('bg-b').value);
      state.bgColor = rgbToHex(r, g, b);
      applyState();
    }

    ['bg-r', 'bg-g', 'bg-b'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateBgColorFromRgb);
    });

    document.getElementById('hex-bg-color').addEventListener('change', (e) => {
      let v = e.target.value.trim();
      if (!v.startsWith('#')) v = '#' + v;
      if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
        state.bgColor = v.toUpperCase();
        applyState();
      }
    });

    // Effects
    document.getElementById('btn-fx-glow').addEventListener('click', () => {
      state.glow = !state.glow;
      applyState();
    });
    document.getElementById('btn-fx-stroke').addEventListener('click', () => {
      state.stroke = !state.stroke;
      applyState();
    });
    document.getElementById('btn-fx-led').addEventListener('click', () => {
      state.led = !state.led;
      applyState();
    });
    document.getElementById('btn-fx-mirror').addEventListener('click', () => {
      state.mirror = !state.mirror;
      applyState();
    });
    document.getElementById('btn-fx-flash').addEventListener('click', () => {
      state.flash = !state.flash;
      applyState();
    });

    window.addEventListener('resize', resetPositions);

    // Initial setup
    applyState();
    lastTime = performance.now();
    animFrame = requestAnimationFrame(loop);
    triggerToolbarVisibility();

    // Auto fade hint after 5s
    setTimeout(() => {
      tapHint.classList.add('fade-out');
    }, 5000);

    // Keep screen on if bridge is available
    if (window.Toolbox && window.Toolbox.system && window.Toolbox.system.keepScreenOn) {
      window.Toolbox.system.keepScreenOn(true);
    }
  </script>
</body>
</html>
