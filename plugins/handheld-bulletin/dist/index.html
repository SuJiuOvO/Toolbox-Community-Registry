<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>手持弹幕举牌</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080D12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }
    #marquee-container {
      display: inline-block;
      white-space: pre;
      line-height: 1.2;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .led-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(rgba(0,0,0,0.4) 15%, transparent 16%) 0 0,
                  radial-gradient(rgba(0,0,0,0.4) 15%, transparent 16%) 4px 4px;
      background-size: 8px 8px;
      display: none;
    }
    /* Controls Panel */
    #toolbar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 24, 33, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 100;
      transition: opacity 0.3s, transform 0.3s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #toolbar.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-20px);
      pointer-events: none;
    }
    .tb-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s, transform 0.1s;
    }
    .tb-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .tb-btn:active {
      transform: scale(0.96);
    }

    /* Drawer Modal */
    #drawer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 22, 30, 0.94);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 110;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
      color: #eee;
    }
    #drawer.open {
      transform: translateY(0);
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .drawer-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .text-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      resize: vertical;
      min-height: 60px;
    }
    .text-input:focus {
      border-color: #53FFAA;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .opt-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ccc;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn.active {
      background: #53FFAA;
      color: #080D12;
      font-weight: 600;
      border-color: #53FFAA;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider {
      flex: 1;
      accent-color: #53FFAA;
    }
    .color-swatches {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }
    .swatch.active {
      border-color: #fff;
      transform: scale(1.15);
    }
    .color-input {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="marquee-container">很高兴遇见你！</div>
    <div class="led-overlay" id="led-mask"></div>
  </div>

  <!-- Top Floating Bar -->
  <div id="toolbar">
    <button class="tb-btn" id="btn-toggle-play">⏸️ 暂停</button>
    <button class="tb-btn" id="btn-edit">⚙️ 设置</button>
    <button class="tb-btn" id="btn-preset">✨ 预设</button>
    <button class="tb-btn" id="btn-fullscreen">⛶ 全屏</button>
  </div>

  <!-- Settings Drawer -->
  <div id="drawer">
    <div class="drawer-header">
      <span class="drawer-title">弹幕举牌定制器</span>
      <button class="tb-btn" id="btn-close-drawer">完成</button>
    </div>

    <div class="form-group">
      <label class="form-label">弹幕文字内容</label>
      <textarea class="text-input" id="input-text" placeholder="输入要举牌或滚动的文字...">很高兴遇见你！</textarea>
    </div>

    <div class="form-group">
      <label class="form-label">经典场景预设</label>
      <div class="btn-group" id="presets-group">
        <button class="opt-btn" data-preset="airport">🛫 机场接机</button>
        <button class="opt-btn" data-preset="idol">🎤 演唱应援</button>
        <button class="opt-btn" data-preset="love">💖 浪漫告白</button>
        <button class="opt-btn" data-preset="market">🏮 招牌集市</button>
        <button class="opt-btn" data-preset="warning">⚠️ 警示通告</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">滚动方向</label>
      <div class="btn-group" id="direction-group">
        <button class="opt-btn" data-dir="left">← 向左</button>
        <button class="opt-btn" data-dir="right">→ 向右</button>
        <button class="opt-btn" data-dir="up">↑ 向上</button>
        <button class="opt-btn" data-dir="down">↓ 向下</button>
        <button class="opt-btn" data-dir="still">⏸️ 静止居中</button>
      </div>
    </div>

    <div class="form-group">
      <div class="form-label">
        <span>滚动速度</span>
        <span id="label-speed">100</span>
      </div>
      <div class="slider-row">
        <input type="range" class="slider" id="slider-speed" min="20" max="400" value="100">
      </div>
    </div>

    <div class="form-group">
      <div class="form-label">
        <span>文字字号</span>
        <span id="label-size">112 px</span>
      </div>
      <div class="slider-row">
        <input type="range" class="slider" id="slider-size" min="30" max="300" value="112">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">文字颜色</label>
      <div class="color-swatches" id="color-swatches">
        <div class="swatch active" style="background:#53FFAA" data-color="#53FFAA"></div>
        <div class="swatch" style="background:#FF4B72" data-color="#FF4B72"></div>
        <div class="swatch" style="background:#FFDF00" data-color="#FFDF00"></div>
        <div class="swatch" style="background:#00E5FF" data-color="#00E5FF"></div>
        <div class="swatch" style="background:#FFFFFF" data-color="#FFFFFF"></div>
        <input type="color" class="color-input" id="custom-color" value="#53FFAA">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">背景颜色</label>
      <div class="color-swatches" id="bg-swatches">
        <div class="swatch active" style="background:#080D12" data-bgcolor="#080D12"></div>
        <div class="swatch" style="background:#000000" data-bgcolor="#000000"></div>
        <div class="swatch" style="background:#1A0022" data-bgcolor="#1A0022"></div>
        <div class="swatch" style="background:#001824" data-bgcolor="#001824"></div>
        <div class="swatch" style="background:#2A0808" data-bgcolor="#2A0808"></div>
        <input type="color" class="color-input" id="custom-bgcolor" value="#080D12">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">视觉特效</label>
      <div class="btn-group">
        <button class="opt-btn" id="btn-fx-glow">🌟 霓虹辉光</button>
        <button class="opt-btn" id="btn-fx-stroke">🔲 文字描边</button>
        <button class="opt-btn" id="btn-fx-led">💡 LED点阵</button>
        <button class="opt-btn" id="btn-fx-mirror">🪞 镜像反转</button>
        <button class="opt-btn" id="btn-fx-flash">⚡ 慢速闪烁</button>
      </div>
    </div>
  </div>

  <script>
    // State Store
    const state = {
      text: '很高兴遇见你！',
      fontSize: 112,
      speed: 100,
      textColor: '#53FFAA',
      bgColor: '#080D12',
      direction: 'left',
      glow: true,
      stroke: false,
      led: false,
      mirror: false,
      flash: false,
      paused: false,
      isFullscreen: false,
      posX: 0,
      posY: 0,
    };

    const container = document.getElementById('marquee-container');
    const stage = document.getElementById('stage');
    const toolbar = document.getElementById('toolbar');
    const drawer = document.getElementById('drawer');
    const ledMask = document.getElementById('led-mask');

    let animFrame = null;
    let lastTime = performance.now();
    let hideTimer = null;

    // Presets Definition
    const PRESETS = {
      airport: {
        text: '接机：张总 一路辛苦！',
        fontSize: 120,
        speed: 110,
        textColor: '#FFDF00',
        bgColor: '#000000',
        direction: 'left',
        glow: true,
        stroke: true,
        led: false,
        flash: false
      },
      idol: {
        text: '★ 全世界最好的你 闪耀舞台 ★',
        fontSize: 130,
        speed: 140,
        textColor: '#FF4B72',
        bgColor: '#1A0022',
        direction: 'left',
        glow: true,
        stroke: false,
        led: false,
        flash: false
      },
      love: {
        text: '做我女朋友好不好？❤️',
        fontSize: 140,
        speed: 0,
        textColor: '#FF4B72',
        bgColor: '#080D12',
        direction: 'still',
        glow: true,
        stroke: true,
        led: false,
        flash: true
      },
      market: {
        text: '🔥 秘制大烤肠 10元3串 🔥',
        fontSize: 120,
        speed: 90,
        textColor: '#53FFAA',
        bgColor: '#000000',
        direction: 'left',
        glow: true,
        stroke: false,
        led: true,
        flash: false
      },
      warning: {
        text: '⚠️ 前方施工 请减速慢行 ⚠️',
        fontSize: 130,
        speed: 0,
        textColor: '#FFDF00',
        bgColor: '#000000',
        direction: 'still',
        glow: true,
        stroke: true,
        led: false,
        flash: true
      }
    };

    function applyState() {
      container.textContent = state.text;
      container.style.fontSize = state.fontSize + 'px';
      container.style.color = state.textColor;
      stage.style.backgroundColor = state.bgColor;

      // Glow effect
      if (state.glow) {
        container.style.textShadow = `0 0 10px \${state.textColor}, 0 0 20px \${state.textColor}, 0 0 40px \${state.textColor}`;
      } else {
        container.style.textShadow = 'none';
      }

      // Stroke
      if (state.stroke) {
        container.style.webkitTextStroke = '2px #fff';
      } else {
        container.style.webkitTextStroke = '0';
      }

      // LED Mask
      ledMask.style.display = state.led ? 'block' : 'none';

      // Mirror
      const mirrorScale = state.mirror ? -1 : 1;
      container.style.transformOrigin = 'center center';

      // Flash
      if (state.flash) {
        container.style.animation = 'flash 1.2s infinite ease-in-out';
      } else {
        container.style.animation = 'none';
      }

      // Sync form controls
      document.getElementById('input-text').value = state.text;
      document.getElementById('slider-speed').value = state.speed;
      document.getElementById('label-speed').textContent = state.speed;
      document.getElementById('slider-size').value = state.fontSize;
      document.getElementById('label-size').textContent = state.fontSize + ' px';

      // Update button active states
      document.querySelectorAll('#direction-group .opt-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.dir === state.direction);
      });
      document.getElementById('btn-fx-glow').classList.toggle('active', state.glow);
      document.getElementById('btn-fx-stroke').classList.toggle('active', state.stroke);
      document.getElementById('btn-fx-led').classList.toggle('active', state.led);
      document.getElementById('btn-fx-mirror').classList.toggle('active', state.mirror);
      document.getElementById('btn-fx-flash').classList.toggle('active', state.flash);

      // Save state to Host Bridge
      if (window.Toolbox && window.Toolbox.storage) {
        window.Toolbox.storage.set('bulletin_settings', state);
      }
    }

    // Main 60fps Loop
    function tick(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (!state.paused && state.direction !== 'still') {
        const stageW = stage.clientWidth;
        const stageH = stage.clientHeight;
        const textW = container.clientWidth;
        const textH = container.clientHeight;

        if (state.direction === 'left') {
          state.posX -= state.speed * dt;
          if (state.posX < -textW) state.posX = stageW;
          state.posY = 0;
        } else if (state.direction === 'right') {
          state.posX += state.speed * dt;
          if (state.posX > stageW) state.posX = -textW;
          state.posY = 0;
        } else if (state.direction === 'up') {
          state.posY -= state.speed * dt;
          if (state.posY < -textH) state.posY = stageH;
          state.posX = 0;
        } else if (state.direction === 'down') {
          state.posY += state.speed * dt;
          if (state.posY > stageH) state.posY = -textH;
          state.posX = 0;
        }
      } else if (state.direction === 'still') {
        state.posX = 0;
        state.posY = 0;
      }

      const mirror = state.mirror ? 'scaleX(-1) ' : '';
      container.style.transform = `\${mirror}translate(\${state.posX}px, \${state.posY}px)`;

      animFrame = requestAnimationFrame(tick);
    }

    function resetPosition() {
      if (state.direction === 'left') state.posX = stage.clientWidth;
      else if (state.direction === 'right') state.posX = -container.clientWidth;
      else if (state.direction === 'up') state.posY = stage.clientHeight;
      else if (state.direction === 'down') state.posY = -container.clientHeight;
      else { state.posX = 0; state.posY = 0; }
    }

    // Auto Hide Toolbar
    function pingActivity() {
      toolbar.classList.remove('hidden');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!drawer.classList.contains('open')) {
          toolbar.classList.add('hidden');
        }
      }, 3500);
    }

    stage.addEventListener('click', (e) => {
      if (drawer.classList.contains('open')) {
        drawer.classList.remove('open');
      } else {
        toolbar.classList.toggle('hidden');
        if (!toolbar.classList.contains('hidden')) {
          pingActivity();
        }
      }
    });

    // Toolbar Listeners
    document.getElementById('btn-toggle-play').addEventListener('click', (e) => {
      e.stopPropagation();
      state.paused = !state.paused;
      e.target.textContent = state.paused ? '▶️ 开始' : '⏸️ 暂停';
    });

    document.getElementById('btn-edit').addEventListener('click', (e) => {
      e.stopPropagation();
      drawer.classList.add('open');
      toolbar.classList.remove('hidden');
    });

    document.getElementById('btn-preset').addEventListener('click', (e) => {
      e.stopPropagation();
      drawer.classList.add('open');
      document.getElementById('presets-group').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('btn-close-drawer').addEventListener('click', () => {
      drawer.classList.remove('open');
      pingActivity();
    });

    document.getElementById('btn-fullscreen').addEventListener('click', (e) => {
      e.stopPropagation();
      state.isFullscreen = !state.isFullscreen;
      if (window.Toolbox && window.Toolbox.system) {
        window.Toolbox.system.setFullscreen(state.isFullscreen);
      }
    });

    // Form inputs
    document.getElementById('input-text').addEventListener('input', (e) => {
      state.text = e.target.value;
      applyState();
    });

    document.getElementById('slider-speed').addEventListener('input', (e) => {
      state.speed = parseFloat(e.target.value);
      document.getElementById('label-speed').textContent = state.speed;
      applyState();
    });

    document.getElementById('slider-size').addEventListener('input', (e) => {
      state.fontSize = parseFloat(e.target.value);
      document.getElementById('label-size').textContent = state.fontSize + ' px';
      applyState();
      resetPosition();
    });

    // Direction
    document.querySelectorAll('#direction-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.direction = btn.dataset.dir;
        applyState();
        resetPosition();
      });
    });

    // Effects
    document.getElementById('btn-fx-glow').addEventListener('click', () => { state.glow = !state.glow; applyState(); });
    document.getElementById('btn-fx-stroke').addEventListener('click', () => { state.stroke = !state.stroke; applyState(); });
    document.getElementById('btn-fx-led').addEventListener('click', () => { state.led = !state.led; applyState(); });
    document.getElementById('btn-fx-mirror').addEventListener('click', () => { state.mirror = !state.mirror; applyState(); });
    document.getElementById('btn-fx-flash').addEventListener('click', () => { state.flash = !state.flash; applyState(); });

    // Swatches
    document.querySelectorAll('#color-swatches .swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        document.querySelectorAll('#color-swatches .swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        state.textColor = sw.dataset.color;
        applyState();
      });
    });
    document.getElementById('custom-color').addEventListener('input', (e) => {
      state.textColor = e.target.value;
      applyState();
    });

    document.querySelectorAll('#bg-swatches .swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        document.querySelectorAll('#bg-swatches .swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        state.bgColor = sw.dataset.bgcolor;
        applyState();
      });
    });
    document.getElementById('custom-bgcolor').addEventListener('input', (e) => {
      state.bgColor = e.target.value;
      applyState();
    });

    // Presets click
    document.querySelectorAll('#presets-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const pKey = btn.dataset.preset;
        if (PRESETS[pKey]) {
          Object.assign(state, PRESETS[pKey]);
          applyState();
          resetPosition();
          if (window.Toolbox && window.Toolbox.system) {
            window.Toolbox.system.showToast('已载入预设: ' + btn.textContent, 'success');
          }
        }
      });
    });

    // Load saved settings from Host Bridge
    function initBridge() {
      if (window.Toolbox) {
        // Keep screen awake
        if (window.Toolbox.system) {
          window.Toolbox.system.setKeepScreenOn(true);
        }
        // Load storage
        if (window.Toolbox.storage) {
          window.Toolbox.storage.get('bulletin_settings').then(saved => {
            if (saved && typeof saved === 'object') {
              Object.assign(state, saved);
              applyState();
              resetPosition();
            }
          }).catch(console.error);
        }
      }
    }

    window.addEventListener('toolboxready', initBridge);
    if (window.Toolbox) initBridge();

    // Start
    applyState();
    resetPosition();
    lastTime = performance.now();
    animFrame = requestAnimationFrame(tick);
    pingActivity();
  </script>
</body>
</html>
